format:
  html:
    theme:
      - default
    css: css/libro.css
    code-link: true
    code-copy: true
    code-overflow: wrap
    number-sections: false   # los capítulos se identifican por el nombre del archivo (Cap. 1.1, 2.3, 3.4…)
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    author-meta: "Daniel Fernandez"
    include-in-header: "plausible.html"
    callout-appearance: default

crossref:
  chapters: false     # figuras y tablas numeradas de forma corrida (Figura 1, 2…)

execute:
  warning: false
  message: false

editor: visual
